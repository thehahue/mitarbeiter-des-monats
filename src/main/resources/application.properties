spring.application.name=mitarbeiter-des-monats
server.port=${PORT:8080}

# Datei statt In-Memory: Die gespeicherte Rangliste überlebt einen Neustart.
spring.datasource.url=jdbc:h2:file:./data/mitarbeiter
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.mvc.problemdetails.enabled=true
# Ein Ranking ist eine ganze Zahl; Nachkommastellen nicht stillschweigend abschneiden.
spring.jackson.deserialization.accept-float-as-int=false
