spring:
  application:
    name: mitarbeiter-des-monats
  # Datei statt In-Memory: Die gespeicherte Rangliste überlebt einen Neustart.
  datasource:
    url: jdbc:h2:file:./data/mitarbeiter
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # Ein Ranking ist eine ganze Zahl; Nachkommastellen nicht stillschweigend abschneiden.
      accept-float-as-int: false

server:
  port: "${PORT:8080}"
